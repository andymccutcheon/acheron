name: Deploy docs to Pages

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Stage allowlisted site files
        id: stage
        run: |
          set -euo pipefail
          site_dir="$(mktemp -d "${RUNNER_TEMP}/acheron-docs-site.XXXXXX")"
          echo "path=${site_dir}" >> "$GITHUB_OUTPUT"
          # Opt-in publish list. docs/ also holds internal reviews, scene sources,
          # build scripts, and explainers pending rebuild with demo data — excluded until allowlisted.
          for src in \
            docs/.nojekyll \
            docs/index.html \
            docs/guide.html
          do
            test -f "$src"
            case "$src" in
              docs/.nojekyll) dest="${site_dir}/.nojekyll" ;;
              docs/index.html) dest="${site_dir}/index.html" ;;
              docs/guide.html) dest="${site_dir}/guide.html" ;;
            esac
            cp "$src" "$dest"
          done
      - name: Configure Pages
        uses: actions/configure-pages@v6
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ${{ steps.stage.outputs.path }}
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
