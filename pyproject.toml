[project]
name = "acheron"
version = "0.2.1"
description = "One-surface MCP context server: consolidate a storage engine's tools behind one policy surface and rerank retrieval."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Andy McCutcheon" }]
keywords = ["mcp", "agents", "retrieval", "reranking", "basic-memory"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]
dependencies = [
  "mcp>=1.0,<2",
  "httpx>=0.27",
]

[project.urls]
Homepage = "https://github.com/andymccutcheon/acheron"
Issues = "https://github.com/andymccutcheon/acheron/issues"

[project.scripts]
acheron = "acheron.server:main"

[dependency-groups]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.24",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/acheron"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
